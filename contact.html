<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - GrindMind</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. HEADER (Pareho sa ibang pages) -->
    <header>
       <a href="index.html" class="logo-container">
            <img src="images/grindmindlogo.png" alt="GrindMind Logo" class="brand-logo">
            <span class="brand-text">GRIND<span>MIND</span></span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="about.html">About Us</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

        <div class="nav-buttons">
            <a href="log-in.html" class="login-btn">Log-in</a>
            <a href="sign-up.html" class="signup-btn">Sign-Up</a>
        </div>
    </header>

    <!-- 2. MAIN CONTAINER PARA SA CONTACT FORM -->
    <div class="container">
        <main class="hero">
            <h1>Contact <span>Us</span></h1>
            <p class="subtitle">Have questions or feedback? Send us a message!</p>
            
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="explore-btn" style="border: none; cursor: pointer; width: 100%; justify-content: center; margin-top: 10px;">
                    Send Message &rarr;
                </button>
            </form>
        </main>
    </div>

    <!-- 3. FOOTER -->
    <footer class="site-footer">
        <p>© 2026 GrindMind. All rights reserved.</p>
    </footer>

</body>
</html>
